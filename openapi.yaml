          type: string
          format: date
          description: 'Exclusive: the first free night again.'
      required:
      - end
      - start
    Destination:
      type: object
      properties:
        area:
          type: string
        city:
          type: string
        hotels:
          type: integer
        rooms:
          type: integer
        from_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
      required:
      - area
      - city
      - from_price
      - hotels
      - image
      - rooms
