      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Discount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          description: Shown to guests, e.g. "Christmas offer".
          maxLength: 100
        percent:
          type: integer
          maximum: 99
          minimum: 1
        starts_on:
          type: string
          format: date
          nullable: true
          description: First discounted night.
        ends_on:
          type: string
          format: date
          nullable: true
          description: Last discounted night.
      required:
      - ends_on
      - id
      - label
      - percent
      - starts_on
