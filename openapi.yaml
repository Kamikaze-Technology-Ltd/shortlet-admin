openapi: 3.0.3
info:
  title: Shortlet Stay API
  version: 1.0.0
  description: Shortlet Stay backend API
paths:
  /api/admin/hotels/:
    get:
      operationId: admin_hotels_list
      description: Every hotel with its owner and numbers. Create and edit hotels
        and rooms through /dashboard/properties/.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: ISO country code.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: name, created_at, booking_count, rating (prefix - to reverse).
      - in: query
        name: owner
        schema:
          type: string
        description: An owner's user id, or "none" for hotels Shortlet Stay manages.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Hotel name, area, city or the owner's name or email.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHotelList'
          description: ''
  /api/admin/hotels/{slug}/:
    get:
      operationId: admin_hotels_retrieve
      description: Every hotel with its owner and numbers. Create and edit hotels
        and rooms through /dashboard/properties/.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: ISO country code.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: name, created_at, booking_count, rating (prefix - to reverse).
      - in: query
        name: owner
        schema:
          type: string
        description: An owner's user id, or "none" for hotels Shortlet Stay manages.
      - in: query
        name: search
        schema:
          type: string
        description: Hotel name, area, city or the owner's name or email.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
          description: ''
  /api/admin/hotels/{slug}/assign-owner/:
    post:
      operationId: admin_hotels_assign_owner_create
      description: Give the hotel to a hotel owner account, or (null) take it back
        for Shortlet Stay to manage.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: ISO country code.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: name, created_at, booking_count, rating (prefix - to reverse).
      - in: query
        name: owner
        schema:
          type: string
        description: An owner's user id, or "none" for hotels Shortlet Stay manages.
      - in: query
        name: search
        schema:
          type: string
        description: Hotel name, area, city or the owner's name or email.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOwnerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignOwnerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignOwnerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
          description: ''
  /api/admin/overview/:
    get:
      operationId: admin_overview_retrieve
      description: The whole platform's numbers for the admin home page.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOverview'
          description: ''
  /api/admin/payments/{id}/mark-refunded/:
    post:
      operationId: admin_payments_mark_refunded_create
      description: Record that a booking payment flagged for refund has been paid
        back (outside Shortlet Stay, e.g. by bank).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/admin/ticket-orders/:
    get:
      operationId: admin_ticket_orders_list
      description: Ticket orders across every event, newest first. Confirm and decline
        them through /dashboard/events/.
      parameters:
      - in: query
        name: event
        schema:
          type: string
        description: The event's slug.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Order reference, buyer name, email or phone.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - pending
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffTicketOrderList'
          description: ''
  /api/admin/ticket-payments/:
    get:
      operationId: admin_ticket_payments_list
      description: Payments for event tickets, newest first.
      parameters:
      - in: query
        name: needs_refund
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Payment or order reference, buyer name or email.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - initiated
          - successful
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffTicketPaymentList'
          description: ''
  /api/admin/ticket-payments/{id}/mark-refunded/:
    post:
      operationId: admin_ticket_payments_mark_refunded_create
      description: Record that a ticket payment flagged for refund has been paid back.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ticket payment.
        required: true
      - in: query
        name: needs_refund
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
        description: Payment or order reference, buyer name or email.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - initiated
          - successful
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffTicketPayment'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        Every account: guests, hotel owners, event organisers and Shortlet Stay staff.

        Accounts are deactivated rather than deleted, so their bookings, payments and reviews stay on record.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: |-
        Every account: guests, hotel owners, event organisers and Shortlet Stay staff.

        Accounts are deactivated rather than deleted, so their bookings, payments and reviews stay on record.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserCreate'
          description: ''
  /api/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        Every account: guests, hotel owners, event organisers and Shortlet Stay staff.

        Accounts are deactivated rather than deleted, so their bookings, payments and reviews stay on record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserDetail'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: |-
        Every account: guests, hotel owners, event organisers and Shortlet Stay staff.

        Accounts are deactivated rather than deleted, so their bookings, payments and reviews stay on record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/admin/users/{id}/send-password-reset/:
    post:
      operationId: admin_users_send_password_reset_create
      description: Email them a link to choose a new password (also how an invited
        account sets its first one).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/admin/users/{id}/sign-out/:
    post:
      operationId: admin_users_sign_out_create
      description: End every session the account has, on every device.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: date_joined, last_login, email, first_name (prefix - to reverse).
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - guest
          - organiser
          - owner
        description: 'admin: Shortlet Stay staff.'
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or phone.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/amenities/:
    get:
      operationId: amenities_list
      tags:
      - amenities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'
          description: ''
  /api/amenities/{id}/:
    get:
      operationId: amenities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this amenity.
        required: true
      tags:
      - amenities
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Sign in or sign up with Google: verifies the Google ID token and returns our own JWT pair.

        201 when a new account was created, 200 when an existing one signed in (it is linked to Google
        on first use if it was created with email and password). The response matches login/register.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change the signed-in user's password. Other devices are signed
        out; this one gets fresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/bookings/:
    get:
      operationId: bookings_list
      description: The signed-in guest's own bookings ("My trips"), and reserving
        new ones.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
