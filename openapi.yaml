    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/NotificationKindEnum'
        title:
          type: string
          maxLength: 200
        body:
          type: string
        link:
          type: string
          description: Frontend path to open.
          maxLength: 300
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_read
      - kind
      - link
      - title
    NotificationKindEnum:
      enum:
      - booking_requested
      - booking_cancelled
      - booking_confirmed
      - booking_declined
      - booking_request_sent
      - booking_cancelled_by_host
      - booking_updated
      - booking_paid
      - payment_needs_refund
      - ticket_confirmed
      - ticket_declined
      - ticket_requested
      - ticket_sold
      - event_cancelled
      - event_updated
      - review_posted
      - support_reply
      type: string
      description: |-
        * `booking_requested` - New reservation request
        * `booking_cancelled` - Reservation cancelled by guest
        * `booking_confirmed` - Your reservation was confirmed
        * `booking_declined` - Your reservation was declined
        * `booking_request_sent` - Your reservation request was sent
        * `booking_cancelled_by_host` - Your booking was cancelled by the host
        * `booking_updated` - Your booking was changed by the host
        * `booking_paid` - New paid booking
        * `payment_needs_refund` - A payment needs refunding
        * `ticket_confirmed` - Your tickets are confirmed
        * `ticket_declined` - Your ticket order was declined
        * `ticket_requested` - New ticket request
        * `ticket_sold` - Tickets sold
        * `event_cancelled` - An event you have tickets for was cancelled
        * `event_updated` - An event you have tickets for changed
        * `review_posted` - A guest reviewed their stay
        * `support_reply` - Support replied to your message
