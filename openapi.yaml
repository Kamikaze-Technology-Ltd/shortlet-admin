          readOnly: true
        title:
          type: string
          description: The button the visitor taps, e.g. "My payment failed".
          maxLength: 120
        answer:
          type: string
          description: Shown when it's chosen. Leave empty for a topic that only leads
            to more choices.
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - answer
      - children
      - id
      - title
