                $ref: '#/components/schemas/PaginatedPublicReviewList'
          description: ''
  /api/units/areas/:
    get:
      operationId: units_areas_list
      description: Distinct neighbourhoods that have published rooms, in one city
        if ?city= is given.
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: Only hotels in this city.
      - in: query
        name: country
        schema:
          type: string
        description: 'ISO country code (e.g. GB): only hotels in that country.'
      tags:
      - units
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /api/units/cities/:
    get:
      operationId: units_cities_list
      description: Distinct cities that have published rooms, for guests to browse
        by city.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: 'ISO country code (e.g. GB): only hotels in that country.'
      tags:
      - units
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /api/units/destinations/:
    get:
      operationId: units_destinations_list
      description: |-
        Neighbourhoods with bookable rooms, busiest first, each with a cover photo.

        A neighbourhood is an area within a city, so two cities' "City Centre"s are two destinations.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: 'ISO country code (e.g. GB): only hotels in that country.'
      tags:
      - units
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
          description: ''
  /api/units/stats/:
    get:
      operationId: units_stats_retrieve
      description: How many hotels, rooms and destinations guests can book.
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: 'ISO country code (e.g. GB): only hotels in that country.'
      tags:
      - units
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
          description: ''
