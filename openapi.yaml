    GoogleAuthRequest:
      type: object
      description: |-
        Sign in, or sign up, with the ID token from Google's "Sign in with Google" button.

        One endpoint serves both the sign-in and sign-up pages: an unknown Google account gets a new
        account of the portal's type (guest, hotel owner or event organiser); a known one is signed in.
      properties:
        credential:
          type: string
          writeOnly: true
          minLength: 1
          description: The ID token (JWT) Google gives the browser.
        portal:
          allOf:
          - $ref: '#/components/schemas/PortalEnum'
          writeOnly: true
          default: guest
      required:
      - credential
